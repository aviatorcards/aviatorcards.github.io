<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tristan Smith - Resume</title>
    <meta name="description"
        content="Tristan Smith - Systems Architect & Full-Stack Developer specializing in private cloud infrastructure, data sovereignty, and robust software architectures.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="index.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="no-print" style="position: fixed; top: 1rem; right: 1rem; z-index: 100;">
        <button onclick="window.print()"
            style="padding: 0.75rem 1.5rem; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 0.5rem; box-shadow: var(--shadow-md);">
            <i data-lucide="printer" size="18"></i>
            Download PDF
        </button>
    </div>

    <div class="resume-container">
        <aside>
            <div class="sidebar-section">
                <h3>Contact</h3>
                <div id="contact-list">
                    <div class="contact-item"><span>Loading...</span></div>
                </div>
            </div>

            <div id="sidebar-sections">
            </div>
        </aside>

        <main>
            <header class="header">
                <h1 id="user-name">Tristan Smith</h1>
                <div id="user-tagline" class="tagline">Systems Architect & Full-Stack Developer</div>
            </header>

            <section id="user-summary" class="summary">
            </section>

            <div id="main-sections">
            </div>
        </main>
    </div>

    <script src="resume.js"></script>
</body>

</html>
